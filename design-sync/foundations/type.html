<!-- @dsCard group="Type" name="Typografie" subtitle="Inter — Headline-Skala & Body" -->
<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#141417;--border:rgba(255,255,255,.08);--text:#ededef;
  --text-muted:#a1a1aa;--radius-pill:999px;--font-sans:'Inter',ui-sans-serif,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);
  line-height:1.6;padding:3rem 2rem;max-width:900px;margin-inline:auto}
h1,h2,h3{line-height:1.1;letter-spacing:-.02em;margin:0 0 .35rem}
.h1{font-size:clamp(2.6rem,7.5vw,5rem);font-weight:800;letter-spacing:-.03em}
.h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700}
.h3{font-size:1.2rem;font-weight:600}
.body{font-size:1.08rem}
.meta{font-size:.85rem;color:var(--text-muted)}
.eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);border:1px solid var(--border);border-radius:var(--radius-pill);
  padding:.35rem .85rem;background:var(--surface)}
.label{color:var(--text-muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;
  margin:2rem 0 .5rem}
</style>
</head>
<body>
<div class="label">Eyebrow</div>
<span class="eyebrow">Persönlicher Blog</span>
<div class="label">Hero / H1 — Inter 800</div>
<div class="h1">Ich baue Dinge</div>
<div class="label">Section / H2 — Inter 700</div>
<div class="h2">Was ich mache</div>
<div class="label">Card / H3 — Inter 600</div>
<div class="h3">Web-Entwicklung</div>
<div class="label">Body — Inter 400, 1.08rem</div>
<p class="body">Gedanken, Projekte und Experimente rund um Software und Automatisierung.</p>
<div class="label">Meta</div>
<div class="meta">Veröffentlicht am 7. Juni 2026 · von Christian</div>
</body>
</html>
