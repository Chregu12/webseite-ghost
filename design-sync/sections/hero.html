<!-- @dsCard group="Sections" name="Hero (Antigravity rings)" -->
<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--surface:#141417;--border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);--text:#ededef;--text-muted:#a1a1aa;
  --accent:#6e8bff;--accent-2:#b07cff;
  --accent-gradient:linear-gradient(135deg,var(--accent),var(--accent-2));
  --radius:16px;--radius-pill:999px;
  --font-sans:'Inter',ui-sans-serif,system-ui,sans-serif;
}
@supports (color: oklch(from white l c h)){
  body{--accent-2:oklch(from var(--accent) l c calc(h + 38));}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.6}
.eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);border:1px solid var(--border);border-radius:var(--radius-pill);
  padding:.35rem .85rem;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;
  padding:.7rem 1.3rem;border-radius:var(--radius-pill);border:1px solid transparent;
  cursor:pointer;text-decoration:none;color:inherit;transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent-gradient);color:#fff}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.hero{position:relative;overflow:hidden;padding-block:clamp(6rem,16vw,11rem);text-align:center}
.hero::before{content:"";position:absolute;inset:-40% 0 auto 0;height:90%;
  background:radial-gradient(55% 55% at 50% 0%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 70%);
  pointer-events:none;filter:blur(24px)}
.hero-rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;
  mask-image:radial-gradient(closest-side,#000 60%,transparent 100%)}
.hero-rings .ring{position:absolute;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);
  aspect-ratio:1;animation:ringPulse 6s ease-in-out infinite}
.hero-rings .ring:nth-child(1){width:min(22rem,70vw);opacity:.9}
.hero-rings .ring:nth-child(2){width:min(34rem,92vw);opacity:.65;animation-delay:.6s}
.hero-rings .ring:nth-child(3){width:min(48rem,120vw);opacity:.4;animation-delay:1.2s}
.hero-rings .ring:nth-child(4){width:min(64rem,150vw);opacity:.25;animation-delay:1.8s}
.hero-rings .orbit{position:absolute;width:min(48rem,120vw);aspect-ratio:1;animation:spin 22s linear infinite}
.hero-rings .orbit::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 18px 4px var(--accent)}
.hero-rings .orbit.reverse{width:min(34rem,92vw);animation-duration:16s;animation-direction:reverse}
.hero-rings .orbit.reverse::before{background:var(--accent-2);box-shadow:0 0 16px 3px var(--accent-2)}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-content{position:relative;z-index:1;animation:heroIn .7s cubic-bezier(.22,1,.36,1) both;
  max-width:1120px;margin-inline:auto;padding-inline:2rem}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero h1{font-size:clamp(2.6rem,7.5vw,5rem);font-weight:800;letter-spacing:-.03em;
  max-width:16ch;margin:1.25rem auto 0;line-height:1.1;text-wrap:balance}
.hero .subtitle{margin-top:1.25rem;font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--text-muted);
  max-width:56ch;margin-inline:auto;text-wrap:pretty}
.cta-row{margin-top:2.25rem;display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<section class="hero">
  <div class="hero-rings" aria-hidden="true">
    <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <span class="orbit"></span><span class="orbit reverse"></span>
  </div>
  <div class="hero-content">
    <span class="eyebrow">Persönlicher Blog</span>
    <h1>Ich baue Dinge mit Code &amp; KI</h1>
    <p class="subtitle">Gedanken, Projekte und Experimente rund um Software und Automatisierung.</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="#">Blog lesen</a>
      <a class="btn btn-secondary" href="#">Über mich</a>
    </div>
  </div>
</section>
</body>
</html>
