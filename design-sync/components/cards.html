<!-- @dsCard group="Components" name="Cards" subtitle="Feature / Post / Testimonial" -->
<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#141417;--border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);--text:#ededef;--text-muted:#a1a1aa;
  --accent:#6e8bff;--radius:16px;--font-sans:'Inter',ui-sans-serif,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);
  line-height:1.6;padding:2rem}
.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:1120px;margin-inline:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.5rem;transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--border-strong);transform:translateY(-2px);
  box-shadow:0 12px 40px -20px var(--accent)}
.card h3{margin:0;font-size:1.2rem;line-height:1.3}
.muted{color:var(--text-muted)}
.post-card-img{aspect-ratio:16/9;border-radius:calc(var(--radius) - 4px);margin-bottom:1rem;
  width:100%;background:linear-gradient(135deg,#1b1b2f,#26203a);display:grid;place-items:center;
  color:var(--text-muted);font-size:.85rem}
.post-meta{font-size:.85rem;color:var(--text-muted);margin-top:.5rem}
.icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#b07cff);
  margin-bottom:1rem;opacity:.9}
figure.card{margin:0}
blockquote{margin:0;font-size:1.05rem}
figcaption{margin-top:1.25rem;display:flex;align-items:center;gap:.75rem}
.avatar{width:40px;height:40px;border-radius:999px;background:linear-gradient(135deg,#3a3a4a,#56506a)}
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="icon"></div>
    <h3>Web-Entwicklung</h3>
    <p class="muted">Moderne Sites mit Next.js, React und TypeScript.</p>
  </div>
  <a class="card" href="#">
    <div class="post-card-img">Feature-Bild</div>
    <h3>Mein erster Beitrag</h3>
    <p class="muted">Ein kurzer Einblick in das, was hier entsteht.</p>
    <div class="post-meta">7. Juni 2026</div>
  </a>
  <figure class="card">
    <blockquote>“Großartige Arbeit, sehr zuverlässig!”</blockquote>
    <figcaption>
      <span class="avatar"></span>
      <span class="muted" style="font-size:.9rem">Anna B. — Kundin</span>
    </figcaption>
  </figure>
</div>
</body>
</html>
