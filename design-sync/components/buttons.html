<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#141417;--border-strong:rgba(255,255,255,.14);--text:#ededef;
  --accent:#6e8bff;--accent-2:#b07cff;
  --accent-gradient:linear-gradient(135deg,var(--accent),var(--accent-2));--radius-pill:999px;
  --font-sans:'Inter',ui-sans-serif,system-ui,sans-serif}
@supports (color: oklch(from white l c h)){body{--accent-2:oklch(from var(--accent) l c calc(h + 38))}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);
  display:grid;place-items:center;min-height:100vh}
.row{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;padding:2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;
  padding:.7rem 1.3rem;border-radius:var(--radius-pill);border:1px solid transparent;
  cursor:pointer;text-decoration:none;color:inherit;
  transition:transform .15s ease,background .2s ease,border-color .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent-gradient);color:#fff}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<div class="row">
  <a class="btn btn-primary" href="#">Blog lesen</a>
  <a class="btn btn-secondary" href="#">Über mich</a>
  <a class="btn btn-ghost" href="#">Mehr erfahren</a>
</div>
</body>
</html>
